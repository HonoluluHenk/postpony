name: CI

# Verify gate + deploy jobs, ADR-0028. Runs the full gate (lint → test with
# 90 % per-file coverage → build → e2e) plus the Worker bundle dry-run on every
# push (any branch or tag), pull request, and manual dispatch. Consistent with
# the Cloudflare Workers target (ADR-0018) — there is no Docker/Coolify
# anywhere. `deploy-staging` feeds the shared staging slot on main merges and
# manual dispatch; `deploy-prod` promotes to production (`spielverlegung.date`)
# only when a `v*` release tag is pushed.
on:
  push:
  pull_request:
  workflow_dispatch:

# Gate jobs need no secrets and read the repo only.
permissions:
  contents: read

# ponytail: the checkout → mise → npm ci provisioning block is duplicated per
# job (four here; the gate jobs add playwright-install). With the fourth copy
# landed, the named upgrade path — extract one local composite action reusing
# this block with a `uses:` per job — is now worth it; deferred here to keep
# this ticket scoped to the deploy path and its tag/version guard.
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Repo's single toolchain source: Node 26 (+ mkcert + turso) via mise.toml.
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v4

      - name: Install npm dependencies
        run: npm ci

      # The vitest 'browser' project runs headless Chromium through
      # @vitest/browser-playwright, which reuses Playwright's browser cache.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Unit + browser tests (90 % per-file coverage enforced)
        run: npm run test

      - name: Build
        run: npm run build

      # Separate step, not part of `npm run verify`: validates the Worker
      # bundle via wrangler --dry-run. `--env=""` pins the top-level
      # (production) config explicitly — once wrangler.jsonc defines
      # environments, an unpinned dry-run still works but leaves the target
      # ambiguous. Keeps the local gate fast while CI owns disposable bundle
      # validation; the staging bundle gets its own dry-run in deploy-staging.
      - name: Validate Worker bundle
        run: npm run worker:build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v4

      - name: Install npm dependencies
        run: npm ci

      # The e2e server (and Playwright) use hostname game-scheduler.localhost.
      # RFC-6761 loopback resolution is not guaranteed on the runner, so map it
      # explicitly before anything binds.
      - name: Map game-scheduler.localhost to loopback
        run: echo "127.0.0.1 game-scheduler.localhost" | sudo tee -a /etc/hosts > /dev/null

      # developer-local-settings/ is gitignored, so the self-signed TLS cert is
      # regenerated on the runner (mkcert installed by mise above). Playwright
      # already sets ignoreHTTPSErrors for the self-signed cert.
      - name: Generate local TLS certificate
        run: ./scripts/create-certs.sh

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite (HTTPS with fixtures)
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        with:
          name: Screenshots
          path: |
            e2e-tests/**/*.png
            test-results/**/*.png

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [ unit, e2e ]
    # The shared staging slot is fed by main merges and manual dispatch only
    # (ADR-0028). The unfiltered `push:` trigger also fires for feature branches
    # and tags, so this guard is what keeps staging exclusive to main + dispatch
    # — last merge wins, no per-PR previews.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      # Credentials come from GitHub secrets only; nothing sensitive is
      # committed. Account id is a secret, never a wrangler.jsonc entry.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v4

      - name: Install npm dependencies
        run: npm ci

      # Cheap fast-fail before anything touches the account: the staging env
      # config and bundle are validated here (no credentials needed), so a bad
      # env block or bundle breaks the pipeline before it reaches the deploy.
      - name: Validate staging Worker bundle (dry-run)
        run: npx wrangler deploy --dry-run --env staging

      # The worker reads TURSO_DB_AUTH_TOKEN as its Turso auth. It stays a
      # Worker secret — `--env staging` scopes it to postpony-staging, never the
      # production worker — and is refreshed from the GitHub secret on every
      # deploy, so a token rotation is just a secret edit. Fail-loud guard: with
      # a missing secret the pipe would otherwise mint a worker with dead DB
      # auth and still report a successful deploy.
      - name: Set staging Turso auth token (secret)
        env:
          TURSO_DB_AUTH_TOKEN: ${{ secrets.TURSO_DB_AUTH_TOKEN_STAGING }}
        run: |
          if [ -z "$TURSO_DB_AUTH_TOKEN" ]; then
            echo "::error::GitHub secret TURSO_DB_AUTH_TOKEN_STAGING is empty; refusing to deploy staging."
            exit 1
          fi
          printf '%s' "$TURSO_DB_AUTH_TOKEN" | npx wrangler secret put TURSO_DB_AUTH_TOKEN --env staging

      # Lazy migration lives in the worker (first request migrates the store),
      # so a deploy is just a deploy — no migration step in the pipeline.
      - name: Deploy staging Worker
        run: npm run worker:deploy -- --env staging

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [ unit, e2e ]
    # Production is promote-only via an explicit release tag (ADR-0028): a `v*`
    # tag push is the single release gesture. The unfiltered `push:` trigger
    # also fires for branches, PRs and dispatches, so this guard is what keeps
    # production unreachable by a merge, a PR, or a stray dispatch — and a
    # branch named like a tag can never slip in: the ref prefix pins the event
    # to an actual tag push.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      # Credentials come from GitHub secrets only; nothing sensitive is
      # committed. Account id is a secret, never a wrangler.jsonc entry.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v4

      - name: Install npm dependencies
        run: npm ci

      # Belt-and-suspenders veto: the release script (ticket 03) produces
      # matching tag/manifest pairs from its side; this guard rejects
      # mismatches from the other side. Anything a human hand-tags whose name
      # is not `v${npm_package_version}` at this commit is not a release and
      # must not touch production. Fails before any account operation.
      - name: Guard — tag must equal the package.json version
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::Refusing production deploy: pushed tag '$GITHUB_REF_NAME' does not match package.json version '$EXPECTED_TAG' at this commit."
            exit 1
          fi

      # The worker reads TURSO_DB_AUTH_TOKEN as its Turso auth. It stays a
      # Worker secret on the production worker (no --env → the top-level
      # `postpony` config, same target as the deploy below) and is refreshed
      # from the GitHub secret on every release deploy, so a token rotation is
      # just a secret edit — the same flow staging proved. Fail-loud guard: a
      # missing secret would otherwise mint a worker with dead DB auth and
      # still report a successful deploy.
      - name: Set production Turso auth token (secret)
        env:
          TURSO_DB_AUTH_TOKEN: ${{ secrets.TURSO_DB_AUTH_TOKEN }}
        run: |
          if [ -z "$TURSO_DB_AUTH_TOKEN" ]; then
            echo "::error::GitHub secret TURSO_DB_AUTH_TOKEN is empty; refusing to deploy production."
            exit 1
          fi
          printf '%s' "$TURSO_DB_AUTH_TOKEN" | npx wrangler secret put TURSO_DB_AUTH_TOKEN

      # Lazy migration lives in the worker (first request migrates the store),
      # so a deploy is just a deploy — no migration step in the pipeline. No
      # --env: the default target is the top-level `postpony` production
      # config with the custom-domain route.
      - name: Deploy production Worker
        run: npm run worker:deploy
