<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PostPony logo">
  <title>PostPony</title>
  <desc>A pony peeking over a calendar whose date arrow moves forward.</desc>
  <!-- Simplified mark tuned for 16-32px legibility -->
  <rect width="32" height="32" rx="6" fill="#1a237e"/>
  <!-- Laughing pony peeking over the calendar -->
  <g fill="#ffffff">
    <path d="M12 8 C10 5 9 2 11.5 2 C13.5 2 14 5 14 8 Z"/>
    <path d="M20 8 C22 5 23 2 20.5 2 C18.5 2 18 5 18 8 Z"/>
    <path d="M16 5 C11 5 9 9 9 13 C9 17 11 20 13 21 L19 21 C21 20 23 17 23 13 C23 9 21 5 16 5 Z"/>
  </g>
  <circle cx="13" cy="12" r="1.1" fill="#1a237e"/>
  <circle cx="19" cy="12" r="1.1" fill="#1a237e"/>
  <ellipse cx="16" cy="18" rx="3" ry="1.6" fill="#1a237e"/>
  <rect x="13.5" y="16.9" width="5" height="1.1" rx="0.5" fill="#ffffff"/>
  <!-- Calendar -->
  <rect x="7" y="21" width="18" height="9" rx="2" fill="#ffffff"/>
  <path d="M7 24 L7 23 Q7 21 9 21 L23 21 Q25 21 25 23 L25 24 Z" fill="#3949ab"/>
  <!-- Bold forward date arrow -->
  <path d="M10 28 Q16 25.5 20 27" fill="none" stroke="#ffb300" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M18 24.5 L23.5 27 L18 29.5 Z" fill="#ffb300"/>
</svg>
