<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PostPony logo">
  <title>PostPony</title>
  <desc>A pony peeking over a calendar whose date arrow moves forward.</desc>
  <!-- Brand background -->
  <rect width="64" height="64" rx="14" fill="#1a237e"/>
  <!-- Laughing pony peeking over the calendar (drawn first; the calendar overlaps the chin) -->
  <g fill="#ffffff">
    <!-- Ears (upright, gently curved) -->
    <path d="M25 16 C21 11 20 4 23.5 3.5 C26.5 3 27.5 10 28 16 Z"/>
    <path d="M39 16 C43 11 44 4 40.5 3.5 C37.5 3 36.5 10 36 16 Z"/>
    <!-- Forelock tuft -->
    <path d="M29 11 C30 6 32 5 32 9 C32 5 34 6 35 11 Z"/>
    <!-- Head with long muzzle -->
    <path d="M32 8 C22 8 18 15 18 24 C18 32 22 40 27 44 L37 44 C42 40 46 32 46 24 C46 15 42 8 32 8 Z"/>
  </g>
  <!-- Eyes -->
  <circle cx="26" cy="22" r="2" fill="#1a237e"/>
  <circle cx="38" cy="22" r="2" fill="#1a237e"/>
  <!-- Nostrils -->
  <circle cx="28" cy="32" r="1" fill="#1a237e"/>
  <circle cx="36" cy="32" r="1" fill="#1a237e"/>
  <!-- Open laughing mouth with big teeth -->
  <ellipse cx="32" cy="39" rx="6" ry="3.5" fill="#1a237e"/>
  <rect x="27" y="35.5" width="10" height="2.4" rx="1" fill="#ffffff"/>
  <!-- Calendar -->
  <rect x="15" y="43" width="34" height="16" rx="3" fill="#ffffff"/>
  <path d="M15 48 L15 46 Q15 43 18 43 L46 43 Q49 43 49 46 L49 48 Z" fill="#3949ab"/>
  <!-- Forward date arrow (postpone: move the date ahead) -->
  <path d="M19 55 Q32 51 42 54" fill="none" stroke="#ffb300" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M40 50 L48 54 L40 58 Z" fill="#ffb300"/>
</svg>
