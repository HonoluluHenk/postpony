<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 64" role="img" aria-label="PostPony logo">
  <title>PostPony</title>
  <desc>A galloping pony in a rounded square next to the PostPony wordmark.</desc>
  <!-- Brand icon: rounded square with galloping pony silhouette -->
  <g transform="translate(4 4)">
    <rect width="56" height="56" rx="12" fill="#1a237e"/>
    <g transform="translate(12 12) scale(1)" fill="#ffffff">
      <!-- Body -->
      <path d="M6 18c1-3 4-5 8-5 3 0 5 1 6 3l3 1c1 0 2 1 2 2v1h-2l-1 2-2 1-1-2H10l-1 2H7l-1-3c-1 0-1-1 0-2z"/>
      <!-- Neck and head -->
      <path d="M20 12l3-4 2 1-1 2 2 1-1 2-2 0-1 1-2-1z"/>
      <!-- Mane -->
      <path d="M22 9l-1-2 2 0 0 2zM24 10l0-2 2 1-1 2z"/>
      <!-- Ear -->
      <path d="M24 8l1-2 1 2-1 1z"/>
      <!-- Front legs -->
      <path d="M19 21l1 5h-2l-1-4zM12 21l1 5h-2l-1-4z"/>
      <!-- Tail (swooshing back) -->
      <path d="M6 17c-2 0-3 1-4 3l2 1 2-2z"/>
    </g>
    <!-- Eye -->
    <circle cx="36.5" cy="23" r="0.9" fill="#1a237e"/>
  </g>
  <!-- Wordmark -->
  <text x="76" y="40" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="28" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#1a237e">Post</tspan>
    <tspan fill="#3949ab">Pony</tspan>
  </text>
</svg>
